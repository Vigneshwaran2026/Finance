<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Stackly</title>

    <style>
        :root {
            --primary: #212c40;
            --primary-dark: #182235;
            --text: #212c40;
            --muted: #687386;
            --border: #dfe3e9;
            --background: #f5f7fa;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #000000;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .error-page {
            width: 100%;
            max-width: none;
            min-height: 100vh;
            text-align: center;
        }

        .error-card {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000000;
            border: 1px solid var(--border);
            border-radius: 0;
            padding: 60px;
            box-shadow: 0 18px 50px rgba(33, 44, 64, 0.22);
        }

        .brand {
            display: inline-block;
            margin-bottom: 34px;
        }

        .brand img {
            width: 190px;
            max-width: 100%;
            height: auto;
            display: block;
        }

        .error-code {
            font-size: clamp(120px, 20vw, 220px);
            line-height: .85;
            font-weight: 800;
            letter-spacing: -8px;
            color: var(--white);
            margin-bottom: 25px;
        }

        .error-code span {
            color: #aeb7c6;
        }

        h1 {
            font-size: clamp(30px, 4.5vw, 46px);
            line-height: 1.2;
            margin-bottom: 13px;
            color: var(--white);
        }

        .message {
            max-width: 510px;
            margin: 0 auto 32px;
            color: #c7ced9;
            font-size: 17px;
            line-height: 1.7;
        }

        .actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            min-height: 46px;
            padding: 12px 20px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all .25s ease;
        }

        .btn-back {
            background: transparent;
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.7);
            transform: translateY(-2px);
        }

        .btn-home {
            background: var(--primary);
            color: var(--white);
            border: 1px solid var(--primary);
        }

        .btn-home:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .footer-text {
            margin-top: 25px;
            color: #aeb7c6;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .error-card {
                min-height: 100vh;
                padding: 40px 25px;
                border-radius: 0;
            }

            .brand {
                margin-bottom: 28px;
            }

            .brand img {
                width: 150px;
            }

            .error-code {
                font-size: 120px;
                letter-spacing: -5px;
                margin-bottom: 22px;
            }

            .message {
                font-size: 14px;
                margin-bottom: 26px;
            }

            .actions {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
                min-height: 44px;
            }
        }

        html,
body {
    overflow-x: hidden;
    max-width: 100%;
    overflow: hidden;
}

    </style>
</head>

<body>
    <main class="error-page">
        <section class="error-card">

            <a href="index.html" class="brand" aria-label="Stackly Home">
                <img src="images/logo.webp" alt="STACKLY">
            </a>

            <div class="error-code">
                4<span>0</span>4
            </div>

            <h1>Page Not Found</h1>

            <p class="message">
                Sorry, the page you are looking for doesn't exist or may have
                been moved. Please go back or return to the Stackly home page.
            </p>

            <div class="actions">
                <a href="javascript:history.back()" class="btn btn-back">
                    <span>←</span>
                    <span>Back</span>
                </a>

                <a href="index.html" class="btn btn-home">
                    <span>⌂</span>
                    <span>Back to Home</span>
                </a>
            </div>

            <p class="footer-text">
                © Stackly. All rights reserved.
            </p>

        </section>
    </main>
</body>
</html>
